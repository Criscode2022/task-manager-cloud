<div class="edit-task-dialog">
  <h2 class="dialog-title">{{ 'TASKS.EDIT_TASK' | translate }}</h2>

  <form class="dialog-form" novalidate (submit)="confirm($event)">
    <mat-form-field appearance="outline" class="dialog-field">
      <mat-label>{{ 'TASKS.TASK_TITLE' | translate }}</mat-label>
      <input
        matInput
        type="text"
        [formField]="form.title"
        [placeholder]="'TASKS.TITLE_PLACEHOLDER' | translate"
      />
    </mat-form-field>

    <mat-form-field appearance="outline" class="dialog-field">
      <mat-label>{{ 'TASKS.DESCRIPTION_OPTIONAL' | translate }}</mat-label>
      <input
        matInput
        type="text"
        [formField]="form.description"
        [placeholder]="'TASKS.DESCRIPTION_PLACEHOLDER_EDIT' | translate"
      />
    </mat-form-field>

    <div
      class="priority-choice"
      role="radiogroup"
      [attr.aria-label]="'TASKS.PRIORITY_LABEL' | translate"
    >
      @for (option of priorityOptions; track option.value) {
        <button
          type="button"
          class="priority-option"
          role="radio"
          [class.is-selected]="editModel().priority === option.value"
          [class.priority-option--high]="option.value === 'high'"
          [class.priority-option--medium]="option.value === 'medium'"
          [class.priority-option--low]="option.value === 'low'"
          [attr.aria-checked]="editModel().priority === option.value"
          (click)="editModel.update((model) => ({ ...model, priority: option.value }))"
        >
          {{ option.labelKey | translate }}
        </button>
      }
    </div>

    <mat-form-field appearance="outline" class="dialog-field">
      <mat-label>{{ 'TASKS.TAGS_OPTIONAL' | translate }}</mat-label>
      <input
        matInput
        type="text"
        [formField]="form.tags"
        [placeholder]="'TASKS.TAGS_PLACEHOLDER_EDIT' | translate"
      />
    </mat-form-field>

    <div class="dialog-actions">
      <button type="button" class="dialog-button dialog-button--quiet" (click)="cancel()">
        {{ 'COMMON.CANCEL' | translate }}
      </button>
      <button type="submit" class="dialog-button" [disabled]="form().invalid()">
        {{ 'COMMON.CONFIRM' | translate }}
      </button>
    </div>
  </form>
</div>
