packages:
  - "apps/*"
  - "packages/*"

# Angular / Ionic / Karma resolve many packages from the workspace root
shamefullyHoist: true
strictPeerDependencies: false
confirmModulesPurge: false

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
