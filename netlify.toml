# Optional legacy static host for apps/web.
# Primary deploy target is Vercel (see VERCEL.md) with two Turborepo projects.

[build]
  base = "."
  command = "pnpm --filter @task-cloud/web build"
  publish = "apps/web/www"

[build.environment]
  NODE_VERSION = "22"
  # Point the PWA at your deployed Nest API, e.g. https://task-cloud-api.vercel.app/api
  API_BASE_URL = "/api"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
